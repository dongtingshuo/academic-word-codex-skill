name: Validate skill

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPYCACHEPREFIX: /tmp/academic-word-pycache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile Python sources
        run: python -m py_compile artifact-template-academic-word/scripts/academic_word.py tools/validate_public_package.py
      - name: Validate public package and documentation
        run: python tools/validate_public_package.py
      - name: Validate bundled masters
        run: |
          python artifact-template-academic-word/scripts/academic_word.py validate \
            --input artifact-template-academic-word/assets/clean-report.docx
          python artifact-template-academic-word/scripts/academic_word.py validate \
            --input artifact-template-academic-word/assets/clean-thesis.docx
      - name: Rebuild and validate clean masters
        run: |
          python artifact-template-academic-word/scripts/academic_word.py make-masters \
            --output-dir /tmp/academic-word-masters
          python artifact-template-academic-word/scripts/academic_word.py validate \
            --input /tmp/academic-word-masters/clean-report.docx
          python artifact-template-academic-word/scripts/academic_word.py validate \
            --input /tmp/academic-word-masters/clean-thesis.docx
